name: build-and-deploy

on:
  push:
    branches: [ "master" ]
    paths:
      - "azure-project/**"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Azure login using Service Principal (your KodeKloud creds)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Debug prints (so we instantly see if variables are empty)
      - name: Debug variables
        run: |
          echo "ACR_NAME=${{ secrets.ACR_NAME }}"
          echo "AKS_CLUSTER_NAME=${{ secrets.AKS_CLUSTER_NAME }}"
          echo "AKS_RESOURCE_GROUP=${{ secrets.AKS_RESOURCE_GROUP }}"

      # Docker login to ACR (no az acr login)
      - name: Docker login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Build & push pgAdmin image (adjust Dockerfile path)
      - name: Build and push pgadmin image
        uses: docker/build-push-action@v6
        with:
          context: azure-project/pgadmin
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/pgadmin:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/pgadmin:${{ github.sha }}

      # Build & push postgres image ONLY if you have your own Dockerfile.
      # If you're using official postgres image, SKIP this whole step.
      # - name: Build and push postgres image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: azure-project/postgres
      #     push: true
      #     tags: |
      #       ${{ secrets.ACR_NAME }}.azurecr.io/postgres:latest
      #       ${{ secrets.ACR_NAME }}.azurecr.io/postgres:${{ github.sha }}

      # Get AKS kubeconfig for kubectl
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # Deploy manifests (make sure your manifests reference the ACR image!)
      - name: Deploy to AKS
        run: |
          kubectl apply -f azure-project/k8s/
          kubectl rollout status deploy/pgadmin --timeout=120s